<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>רואים עולם | עריכה ויזואלית</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;600;700;800&display=swap');
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:"Noto Sans Hebrew",Arial,sans-serif;background:#eef2f7;color:#17243a;overflow:hidden}
button,input,textarea,select{font:inherit}.top{height:62px;background:#fff;border-bottom:1px solid #dfe6ef;display:flex;align-items:center;gap:8px;padding:0 12px;overflow-x:auto}.brand{font-weight:900;color:#071a34;margin-left:auto;white-space:nowrap}.top button,.top a{height:39px;border:1px solid #dfe6ef;background:#fff;border-radius:9px;padding:0 12px;text-decoration:none;color:#17243a;display:inline-flex;align-items:center;cursor:pointer;white-space:nowrap}.top .save{background:#0c7a55;color:#fff;border-color:#0c7a55;font-weight:800}
.app{height:calc(100% - 62px);display:grid;grid-template-columns:330px 1fr}.side{background:#fff;border-left:1px solid #dfe6ef;padding:13px;overflow:auto}.work{padding:18px;overflow:auto;direction:ltr}.canvas{margin:auto;background:#fff;box-shadow:0 14px 50px rgba(7,26,52,.14);width:100%;max-width:1440px;transition:.2s}.canvas.tablet{max-width:820px}.canvas.mobile{max-width:390px}.canvas iframe{width:100%;height:calc(100vh - 100px);border:0;display:block}
.panel{border:1px solid #dfe6ef;border-radius:12px;margin-bottom:12px;overflow:hidden}.panel h3{margin:0;padding:10px 12px;background:#f7f9fc;font-size:14px}.body{padding:11px}.hint{font-size:12px;color:#6d7b8d;line-height:1.55}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe6ef;border-radius:8px;padding:8px}.field textarea{min-height:86px;resize:vertical}
.rows{display:grid;gap:6px}.row{border:1px solid #dfe6ef;border-radius:9px;padding:7px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center}.row b{font-size:12px}.tools{display:flex;gap:3px}.tools button{width:28px;height:28px;border:1px solid #dfe6ef;background:#fff;border-radius:6px;padding:0}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:1px solid #dfe6ef;background:#fff;border-radius:8px;padding:7px 9px}.actions .danger{color:#b83242}.status{font-size:11px;color:#6d7b8d;min-width:90px}.toast{position:fixed;left:15px;bottom:15px;background:#071a34;color:#fff;padding:10px 13px;border-radius:9px;display:none;z-index:50}
@media(max-width:900px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto}.side{border-left:0}.work{padding:8px}.canvas iframe{height:72vh}}
</style></head><body>
<div class="top"><div class="brand">רואים עולם — עריכה ויזואלית</div><button data-dev="desktop">מחשב</button><button data-dev="tablet">טאבלט</button><button data-dev="mobile">טלפון</button><button id="add">＋ אזור ריבועים</button><a href="/admin/">ניהול רגיל</a><button class="save" id="save">פרסום</button><span class="status" id="status">טוען…</span></div>
<div class="app"><aside class="side">
<div class="panel"><h3>עריכת הפריט שנבחר</h3><div class="body" id="ins"><div class="hint">לחץ על טקסט או תמונה בתוך האתר.</div></div></div>
<div class="panel"><h3>מבנה האתר</h3><div class="body"><div class="rows" id="rows"></div></div></div>
<div class="panel"><h3>עיצוב מהיר</h3><div class="body" id="design"></div></div>
</aside><main class="work"><div class="canvas" id="canvas"><iframe id="frame" src="/?visual=1"></iframe></div></main></div><div class="toast" id="toast"></div>
<script>
var REPO=localStorage.getItem('roimOlamRepo')||localStorage.getItem('kosherFlyRepo')||'0534124060/kosher-fly',site=null,selected='',token=sessionStorage.getItem('kfVisualToken')||'',pending=new Map();
var frame=document.getElementById('frame'),ins=document.getElementById('ins'),rows=document.getElementById('rows'),statusEl=document.getElementById('status'),canvas=document.getElementById('canvas');
var labels={hero:'אזור ראשי',idea:'איך זה יכול להיות זול',process:'איך זה עובד',fee:'מחיר השירות',request:'טופס בקשה',destinations:'יעדים',faq:'שאלות ותשובות'};
function toast(s){var t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(function(){t.style.display='none'},2600)}
function parts(p){return p.split('.').map(function(x){return /^\d+$/.test(x)?Number(x):x})}
function get(p){var c=site;parts(p).forEach(function(k){if(c!=null)c=c[k]});return c}
function setv(p,v){var a=parts(p),c=site;for(var i=0;i<a.length-1;i++){if(c[a[i]]==null)c[a[i]]=typeof a[i+1]==='number'?[]:{};c=c[a[i]]}c[a[a.length-1]]=v}
function copy(v){return JSON.parse(JSON.stringify(v))}
function refresh(){if(frame.contentWindow&&frame.contentWindow.KF_setSite)frame.contentWindow.KF_setSite(copy(site));renderRows();renderDesign();statusEl.textContent='שינויים לא פורסמו'}
function selectPath(p){selected=p;var v=get(p),isImg=/image|logo|backgroundImage/i.test(p);ins.innerHTML='<div class="field"><label>'+p+'</label>'+(isImg?'<input id="val" value="'+String(v||'').replace(/"/g,'&quot;')+'"><input id="up" type="file" accept="image/*" style="margin-top:7px">':'<textarea id="val"></textarea>')+'</div>';var val=document.getElementById('val');if(!isImg)val.value=v==null?'':v;val.oninput=function(){setv(p,val.value);refresh()};if(isImg)document.getElementById('up').onchange=upload}
function upload(e){var f=e.target.files&&e.target.files[0];if(!f)return;var ext=(f.name.split('.').pop()||'png').replace(/[^a-z0-9]/gi,'').toLowerCase()||'png',p='/images/uploads/visual-'+Date.now()+'.'+ext;pending.set(p,f);setv(selected,p);refresh();toast('התמונה תעלה בזמן הפרסום')}
function decorate(){var d=frame.contentDocument;if(!d)return;d.addEventListener('click',function(e){var el=e.target.closest('[data-kf-path]');if(el){e.preventDefault();e.stopPropagation();selectPath(el.dataset.kfPath)}},true)}
frame.addEventListener('load',function(){if(site&&frame.contentWindow.KF_setSite){frame.contentWindow.KF_setSite(copy(site));setTimeout(decorate,80)}});
window.addEventListener('message',function(e){if(e.origin===location.origin&&e.data&&e.data.type==='kf-rendered')setTimeout(decorate,50)});
function customKey(s,i){return 'custom:'+(s.anchor||('area-'+i))}
function allKeys(){var a=['hero','idea','process','fee','request','destinations'];(site.customSections||[]).forEach(function(s,i){a.push(customKey(s,i))});a.push('faq');return a}
function vs(){site.visualSettings=site.visualSettings||{};if(!Array.isArray(site.visualSettings.layoutOrder))site.visualSettings.layoutOrder=allKeys();if(!Array.isArray(site.visualSettings.hiddenSectionKeys))site.visualSettings.hiddenSectionKeys=[];return site.visualSettings}
function move(k,n){var a=vs().layoutOrder,i=a.indexOf(k),j=Math.max(0,Math.min(a.length-1,i+n));if(i<0||i===j)return;a.splice(i,1);a.splice(j,0,k);refresh()}
function hide(k){var a=vs().hiddenSectionKeys,i=a.indexOf(k);if(i>=0)a.splice(i,1);else a.push(k);refresh()}
function delSec(k){if(k.indexOf('custom:')!==0||!confirm('למחוק את האזור?'))return;var i=(site.customSections||[]).findIndex(function(s,j){return customKey(s,j)===k});if(i>=0)site.customSections.splice(i,1);site.visualSettings.layoutOrder=vs().layoutOrder.filter(function(x){return x!==k});refresh()}
function renderRows(){if(!site)return;var hidden=new Set(vs().hiddenSectionKeys),order=vs().layoutOrder.concat(allKeys()).filter(function(v,i,a){return allKeys().indexOf(v)>=0&&a.indexOf(v)===i});rows.innerHTML='';order.forEach(function(k){var r=document.createElement('div');r.className='row';r.innerHTML='<b>'+(labels[k]||k.replace('custom:','אזור: '))+'</b><div class="tools"><button title="למעלה">↑</button><button title="למטה">↓</button><button title="הצג/הסתר">'+(hidden.has(k)?'◉':'◌')+'</button>'+(k.indexOf('custom:')===0?'<button title="מחק">×</button>':'')+'</div>';var b=r.querySelectorAll('button');b[0].onclick=function(){move(k,-1)};b[1].onclick=function(){move(k,1)};b[2].onclick=function(){hide(k)};if(b[3])b[3].onclick=function(){delSec(k)};rows.appendChild(r)})}
function addSec(){site.customSections=site.customSections||[];var anchor='area-'+Date.now().toString().slice(-6);site.customSections.push({enabled:true,anchor:anchor,kicker:'',title:'כותרת חדשה',description:'לחץ על הטקסט כדי לערוך',columns:3,style:'light',cards:[{icon:'✦',title:'ריבוע 1',text:'טקסט קצר'},{icon:'✦',title:'ריבוע 2',text:'טקסט קצר'},{icon:'✦',title:'ריבוע 3',text:'טקסט קצר'}]});var k=customKey(site.customSections[site.customSections.length-1],site.customSections.length-1),a=vs().layoutOrder,fi=a.indexOf('faq');a.splice(fi<0?a.length:fi,0,k);refresh()}
document.getElementById('add').onclick=addSec;
function renderDesign(){site.branding=site.branding||{};site.design=site.design||{};document.getElementById('design').innerHTML='<div class="field"><label>גודל לוגו</label><input id="lh" type="range" min="45" max="160" step="5" value="'+(Number(site.branding.logoHeight)||68)+'"><small id="lhv">'+(Number(site.branding.logoHeight)||68)+'px</small></div><div class="field"><label>צבע ראשי</label><input id="pc" type="color" value="'+(site.design.primaryColor||'#071a34')+'"></div><div class="field"><label>צבע הדגשה</label><input id="ac" type="color" value="'+(site.design.accentColor||'#d8ad48')+'"></div><div class="field"><label>עיגול פינות</label><input id="cr" type="range" min="0" max="40" value="'+(Number(site.design.cardRadius)||18)+'"></div>';document.getElementById('lh').oninput=function(e){site.branding.logoHeight=Number(e.target.value);document.getElementById('lhv').textContent=e.target.value+'px';refresh()};document.getElementById('pc').oninput=function(e){site.design.primaryColor=e.target.value;refresh()};document.getElementById('ac').oninput=function(e){site.design.accentColor=e.target.value;refresh()};document.getElementById('cr').oninput=function(e){site.design.cardRadius=Number(e.target.value);refresh()}}
document.querySelectorAll('[data-dev]').forEach(function(b){b.onclick=function(){canvas.className='canvas '+(b.dataset.dev==='desktop'?'':b.dataset.dev)}});
async function load(){try{var r=await fetch('/content/site.json?ts='+Date.now(),{cache:'no-store'});site=await r.json();vs();renderRows();renderDesign();statusEl.textContent='מוכן';if(frame.contentWindow&&frame.contentWindow.KF_setSite)frame.contentWindow.KF_setSite(copy(site))}catch(e){statusEl.textContent='שגיאת טעינה';toast('לא הצלחתי לטעון את תוכן האתר')}}
function auth(){return new Promise(function(resolve,reject){var pop=window.open('https://api.netlify.com/auth?provider=github&site_id='+encodeURIComponent(location.hostname)+'&scope=repo,user','github','width=720,height=740');if(!pop)return reject(new Error('הדפדפן חסם חלון כניסה'));function on(e){if(typeof e.data!=='string')return;if(e.data==='authorizing:github'){try{e.source.postMessage('authorizing:github',e.origin)}catch(x){}return}var p='authorization:github:success:';if(e.data.indexOf(p)===0){try{var d=JSON.parse(e.data.slice(p.length));token=d.token;sessionStorage.setItem('kfVisualToken',token);window.removeEventListener('message',on);try{pop.close()}catch(x){}resolve(token)}catch(x){reject(x)}}if(e.data.indexOf('authorization:github:error:')===0){window.removeEventListener('message',on);reject(new Error('התחברות GitHub נכשלה'))}}window.addEventListener('message',on)})}
function hdr(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
async function gh(path,opt){var r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,opt||{headers:hdr()});if(!r.ok)throw new Error('GitHub '+r.status);return r.json()}
function b64s(s){var u=new TextEncoder().encode(s),bin='';for(var i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(bin)}
async function b64f(f){var u=new Uint8Array(await f.arrayBuffer()),bin='';for(var i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(bin)}
async function put(path,content,sha,msg){var body={message:msg,content:content,branch:'main'};if(sha)body.sha=sha;return gh(path,{method:'PUT',headers:hdr(),body:JSON.stringify(body)})}
async function publish(){try{document.getElementById('save').disabled=true;statusEl.textContent='מתחבר…';if(!token)await auth();for(var it of pending){var p=it[0].replace(/^\//,''),f=it[1],ex=null;try{ex=await gh(p)}catch(e){}await put(p,await b64f(f),ex&&ex.sha,'Visual editor: upload image')}statusEl.textContent='שומר…';var cur=await gh('content/site.json');await put('content/site.json',b64s(JSON.stringify(site,null,2)+'\n'),cur.sha,'Visual editor: update site');pending.clear();statusEl.textContent='פורסם ✓';toast('נשמר ב-GitHub. Netlify יפרסם אוטומטית.')}catch(e){statusEl.textContent='שגיאה';toast(e.message||'הפרסום נכשל')}finally{document.getElementById('save').disabled=false}}
document.getElementById('save').onclick=publish;load();
</script></body></html>
